services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.vite
    container_name: greenfeed-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
      - catalogo-backend
    networks:
      - greenfeed-net

  backend:
    build:
      context: ./usuarios_ws
      dockerfile: Dockerfile
    container_name: greenfeed-backend
    ports:
      - "8003:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - greenfeed-net

  catalogo-backend:
    build:
      context: ./catalogo_ws
      dockerfile: Dockerfile
    container_name: catalogo_api
    restart: always
    ports:
      - "8004:8004"
    volumes:
      - ./catalogo_ws:/app
    depends_on:
      catalogo-db:
        condition: service_healthy
    networks:
      - greenfeed-net

  catalogo-db:
    image: mysql:8.0
    container_name: catalogo-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: Catalogos
      MYSQL_USER: proyecto
      MYSQL_PASSWORD: p123
    ports:
      - "3307:3306"
    volumes:
      - catalogo_mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uproyecto", "-pp123", "--silent" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - greenfeed-net

  db:
    image: mysql:8.0
    container_name: greenfeed-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: Usuarios
      MYSQL_USER: proyecto
      MYSQL_PASSWORD: p123
    ports:
      - "3310:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uproyecto", "-pp123", "--silent" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - greenfeed-net

networks:
  greenfeed-net:
    driver: bridge

volumes:
  mysql_data:
  catalogo_mysql_data:
